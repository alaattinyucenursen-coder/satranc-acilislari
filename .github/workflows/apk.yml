# Telefon uygulamasının (Android APK) derlenmesi.
# Her derlemede APK hem bu çalışmanın "Artifacts" bölümüne hem de "apk-son" adlı
# GitHub sürümüne (Releases) yüklenir; telefondan oradan indirilip kurulabilir.
name: APK

on:
  push:
    branches: [main, claude/vezir-gambiti-varyantlar-o8gkv7]
    paths:
      - "app/**"
      - "data/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bağımlılıklar
        run: npm ci

      - name: Verileri doğrula ve uygulama dosyalarını hazırla
        run: |
          npm run check
          npm run app

      - name: Android projesi
        run: |
          npx cap add android
          # Uygulama simgesi ve açılış ekranı
          cp -r app/android-res/mipmap-* app/android-res/values android/app/src/main/res/
          find android/app/src/main/res -name splash.png -exec cp app/android-res/splash.png {} \;
          # Sürüm numarası: her derlemede artar, böylece yeni APK eskisinin üzerine kurulur.
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          # Sabit imza anahtarı: her derleme aynı anahtarla imzalanır, böylece yeni APK
          # eskisinin üzerine kurulabilir ("tutarsız imza" hatası çıkmaz).
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/../app/android-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE
          npx cap sync android

      - name: APK derle
        run: |
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AcilisDefteri.apk"
          # İmzanın sabit anahtarla atıldığını doğrula.
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$GITHUB_WORKSPACE/AcilisDefteri.apk" | tee /tmp/cert.txt
          grep -qi "SHA-256 digest: 50ab54063800fd2f651fefbb7a574e26ff5eefb57a901b7f24b76c84f5f5a0bc" /tmp/cert.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AcilisDefteri-apk
          path: AcilisDefteri.apk

      - name: Sürüme yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-son
          name: Açılış Defteri (son sürüm)
          prerelease: true
          make_latest: false
          files: AcilisDefteri.apk
          body: |
            Telefona kurmak için AcilisDefteri.apk dosyasını indirip açın.
            Android "bilinmeyen kaynaklardan yükleme" izni isteyebilir.
            Derleme: 1.0.${{ github.run_number }} (${{ github.sha }})
